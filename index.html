<!DOCTYPE html>
<html>
<head>
    <title>Valentine Surprise</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #fff0f5;
            position: relative;
        }
        h1 {
            color: #ff1493;
            margin-top: 20px;
        }
        img {
            width: 250px;
            height: auto;
            border-radius: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(255, 20, 147, 0.3);
            position: relative;
            z-index: 10;
        }
        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #ff69b4;
            color: white;
            transition: transform 0.2s;
            position: absolute;
            z-index: 10;
        }
        button:hover {
            transform: scale(1.1);
        }
        #yesBtn {
            left: 120px;
            top: 350px;
        }
        #noBtn {
            left: 250px;
            top: 350px;
        }
        #message {
            margin-top: 20px;
            font-size: 22px;
            color: #ff1493;
            font-weight: bold;
            position: relative;
            z-index: 10;
        }
        .heart {
            position: absolute;
            font-size: 24px;
            color: pink;
            animation: bounce 0.5s ease;
            user-select: none;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .sparkle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #ff69b4;
            border-radius: 50%;
            opacity: 0.8;
            animation: sparkle 2s infinite;
        }
        @keyframes sparkle {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            50% { transform: translateY(-20px) scale(1.5); opacity: 0.3; }
            100% { transform: translateY(0) scale(1); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <h1>Will you be my Valentine?</h1>

    <!-- Her image -->
    <img src="her.jpeg" alt="Her Image" id="valImage">

    <!-- Buttons -->
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>

    <p id="message"></p>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const valImage = document.getElementById('valImage');
        const message = document.getElementById('message');

        let autoTimeoutFired = false;

        // Hearts spiraling toward image
        function createHeartSpiral() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerText = '❤️';

            const rect = yesBtn.getBoundingClientRect();
            heart.style.left = (rect.left + rect.width/2) + 'px';
            heart.style.top = (rect.top - 20) + 'px';

            document.body.appendChild(heart);

            const imgRect = valImage.getBoundingClientRect();
            const imgCenterX = imgRect.left + imgRect.width/2;
            const imgCenterY = imgRect.top + imgRect.height/2;

            let angle = 0;
            let posX = parseFloat(heart.style.left);
            let posY = parseFloat(heart.style.top);
            let step = 0;

            const moveHeart = setInterval(() => {
                angle += 0.2;
                posX += (imgCenterX - posX) * 0.07 + Math.sin(angle) * 2;
                posY += (imgCenterY - posY) * 0.07 + Math.cos(angle) * 2;
                heart.style.left = posX + 'px';
                heart.style.top = posY + 'px';
                step++;

                if(step > 80) {
                    heart.remove();
                    clearInterval(moveHeart);
                }
            }, 20);
        }

        // Sparkles in background
        function createSparkle() {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = Math.random() * window.innerWidth + 'px';
            sparkle.style.top = Math.random() * window.innerHeight + 'px';
            sparkle.style.width = (2 + Math.random() * 4) + 'px';
            sparkle.style.height = (2 + Math.random() * 4) + 'px';
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 2000);
        }

        // Show Valentine message
        function sayYes() {
            message.innerText = "Thank you so much for being my Valentine, I Love you so much";
            for(let i=0;i<25;i++){
                setTimeout(createHeartSpiral,i*120);
            }
            for(let i=0;i<50;i++){
                setTimeout(createSparkle,i*100);
            }
        }

        yesBtn.addEventListener('click', sayYes);

        // Move No button faster
        function moveNoButton() {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        // No button interaction
        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', moveNoButton);

        noBtn.addEventListener('click', () => {
            // Even if clicked, playful message
            message.innerText = "Not even an option... Thank you for being my Valentine 🙈😘";
        });

        // Auto trigger after 10 seconds
        setTimeout(() => {
            if(!autoTimeoutFired){
                autoTimeoutFired = true;
                sayYes();
            }
        }, 10000);
    </script>
</body>
</html>
