<!DOCTYPE html>
<html>
<head>
    <title>Valentine Surprise</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #8b0000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
        }
        h1 {
            margin-top: 20px;
            color: #fff;
            text-shadow: 2px 2px #ff1493;
            text-align: center;
            padding: 0 20px;
        }
        #valImage {
            width: 40%;
            max-width: 200px;
            border-radius: 20px;
            margin: 20px 0;
            box-shadow: 0 4px 25px rgba(255, 20, 147, 0.5);
        }
        #buttonsContainer {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
            margin-bottom: 50px;
            position: relative;
            width: 100%;
            min-height: 80px;
            align-items: center;
        }
        button {
            padding: 15px 40px;
            font-size: 22px;
            cursor: pointer;
            border: 3px solid #ff1493;
            border-radius: 12px;
            background-color: white;
            color: black;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 10;
        }
        button:hover {
            transform: scale(1.15);
            box-shadow: 0 0 20px #ff1493;
        }
        #yesBtn {
            position: relative;
        }
        #noBtn {
            position: relative;
        }
        .heart {
            position: fixed;
            font-size: 28px;
            animation: bounce 0.5s ease;
            user-select: none;
            pointer-events: none;
            z-index: 1000;
        }
        @keyframes bounce {
            0%,100%{transform:translateY(0);}
            50%{transform:translateY(-15px);}
        }
        .message-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(139, 0, 0, 0.97);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            flex-direction: column;
        }
        .message-content {
            font-size: 32px;
            text-align: center;
            padding: 40px;
            color: white;
            max-width: 80%;
            line-height: 1.5;
        }
        .close-btn {
            margin-top: 30px;
            padding: 12px 35px;
            background: #ff1493;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .close-btn:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <h1>Will you be my Valentine? ❤️💖</h1>
    <img src="her.jpeg" alt="Her Image" id="valImage">
    <div id="buttonsContainer">
        <button id="yesBtn">Yes ❤️</button>
        <button id="noBtn">No 💔</button>
    </div>

    <div id="messageOverlay" class="message-overlay">
        <div class="message-content" id="messageText"></div>
        <button class="close-btn" onclick="closeMessage()">Close ❤️</button>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const valImage = document.getElementById('valImage');
        const messageOverlay = document.getElementById('messageOverlay');
        const buttonsContainer = document.getElementById('buttonsContainer');
        
        let hasClicked = false;

        // Hearts animation
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerText = '💖';
            const rect = valImage.getBoundingClientRect();
            heart.style.left = (rect.left + rect.width/2 + (Math.random()*100-50)) + 'px';
            heart.style.top = (rect.top + (Math.random()*50-25)) + 'px';
            document.body.appendChild(heart);

            let step = 0;
            const moveHeart = setInterval(() => {
                const currentTop = parseInt(heart.style.top);
                const currentLeft = parseInt(heart.style.left);
                heart.style.top = (currentTop - 2) + 'px';
                heart.style.left = (currentLeft + Math.sin(step)*2) + 'px';
                step += 0.2;
                if(step > 80){
                    heart.remove();
                    clearInterval(moveHeart);
                }
            }, 20);
        }

        // Sparkles
        function createSparkle() {
            const sparkle = document.createElement('div');
            sparkle.style.position = 'fixed';
            sparkle.style.fontSize = (20 + Math.random()*20) + 'px';
            sparkle.innerText = '❤️';
            sparkle.style.left = Math.random()*window.innerWidth + 'px';
            sparkle.style.top = Math.random()*window.innerHeight + 'px';
            sparkle.style.pointerEvents = 'none';
            sparkle.style.zIndex = '9999';
            document.body.appendChild(sparkle);
            setTimeout(()=>sparkle.remove(), 2000);
        }

        // Show message overlay
        function showMessage(msg) {
            // Clear previous content
            messageOverlay.innerHTML = '';
            
            // Create message content
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.innerHTML = msg + ' ❤️💖';
            messageOverlay.appendChild(messageContent);
            
            // Create close button
            const closeBtn = document.createElement('button');
            closeBtn.className = 'close-btn';
            closeBtn.innerHTML = 'Close ❤️';
            closeBtn.onclick = closeMessage;
            messageOverlay.appendChild(closeBtn);
            
            // Show overlay
            messageOverlay.style.display = 'flex';
            
            // Create hearts in the overlay
            for(let i=0;i<50;i++){
                setTimeout(()=>{
                    const h = document.createElement('div');
                    h.innerText = '💖';
                    h.style.position = 'fixed';
                    h.style.left = Math.random()*window.innerWidth + 'px';
                    h.style.top = Math.random()*window.innerHeight + 'px';
                    h.style.fontSize = '24px';
                    h.style.pointerEvents = 'none';
                    h.style.zIndex = '9999';
                    messageOverlay.appendChild(h);
                    setTimeout(()=>h.remove(), 3000);
                }, i*100);
            }
        }

        // Close message overlay
        function closeMessage() {
            messageOverlay.style.display = 'none';
        }

        // Yes button click
        yesBtn.addEventListener('click', ()=>{
            hasClicked = true;
            for(let i=0;i<30;i++) setTimeout(createHeart,i*80);
            for(let i=0;i<40;i++) setTimeout(createSparkle,i*100);
            setTimeout(() => {
                showMessage("Thank you so much for being my Valentine, I Love you so much");
            }, 500);
        });

        // No button movement - make it run away!
        function moveNoButton(e) {
            e.preventDefault();
            
            // Get button and window dimensions
            const buttonRect = noBtn.getBoundingClientRect();
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            // Calculate safe boundaries
            const maxX = windowWidth - buttonRect.width - 20;
            const maxY = windowHeight - buttonRect.height - 20;
            
            // Generate random position
            let newX = Math.random() * maxX;
            let newY = Math.random() * maxY;
            
            // Make sure it's far from current position
            const currentX = buttonRect.left;
            const currentY = buttonRect.top;
            
            // If new position is too close, try again
            if(Math.abs(newX - currentX) < 100 || Math.abs(newY - currentY) < 100) {
                newX = (newX + windowWidth/2) % maxX;
                newY = (newY + windowHeight/2) % maxY;
            }
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
        }

        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('touchstart', moveNoButton);
        noBtn.addEventListener('mouseover', moveNoButton);

        // No button click - same message as Yes
        noBtn.addEventListener('click', (e)=>{
            e.preventDefault();
            hasClicked = true;
            for(let i=0;i<30;i++) setTimeout(createHeart,i*80);
            for(let i=0;i<40;i++) setTimeout(createSparkle,i*100);
            setTimeout(() => {
                showMessage("Thank you so much for being my Valentine, I Love you so much");
            }, 500);
        });

        // Auto message after 20 seconds if she hasn't clicked Yes
        setTimeout(()=>{
            if(!hasClicked) {
                showMessage("Don't even think about clicking NO, It's not an option, Click YES");
            }
        }, 20000);
    </script>
</body>
</html>
