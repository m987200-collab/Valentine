<!DOCTYPE html>
<html>
<head>
    <title>Valentine Surprise</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            overflow: hidden;
            background: #fff0f5;
            position: relative;
        }
        h1 {
            color: #ff1493;
        }
        button {
            padding: 12px 25px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #ff69b4;
            color: white;
            transition: transform 0.2s;
            position: relative;
            z-index: 10;
        }
        button:hover {
            transform: scale(1.1);
        }
        #message {
            margin-top: 30px;
            font-size: 22px;
            color: #ff1493;
            font-weight: bold;
            position: relative;
            z-index: 10;
        }
        .heart {
            position: absolute;
            font-size: 24px;
            color: pink;
            animation: float 3s ease-out forwards, bounce 0.5s ease;
            user-select: none;
        }
        @keyframes float {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-400px) scale(1.5); opacity: 0; }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .sparkle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #ff69b4;
            border-radius: 50%;
            opacity: 0.8;
            animation: sparkle 2s infinite;
        }
        @keyframes sparkle {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            50% { transform: translateY(-20px) scale(1.5); opacity: 0.3; }
            100% { transform: translateY(0) scale(1); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <h1>Will you be my Valentine?</h1>
    <button id="yesBtn" onclick="sayYes()">Yes</button>
    <button onclick="sayNo()">No</button>

    <p id="message"></p>

    <script>
        // Create floating hearts from the Yes button
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerText = '❤️';

            const btn = document.getElementById('yesBtn');
            const rect = btn.getBoundingClientRect();

            // Start position at button
            heart.style.left = (rect.left + rect.width / 2 + (Math.random()*40-20)) + 'px';
            heart.style.top = (rect.top - 20) + 'px';
            heart.style.fontSize = (20 + Math.random() * 30) + 'px';

            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 3000);
        }

        // Create random background sparkles
        function createSparkle() {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = Math.random() * window.innerWidth + 'px';
            sparkle.style.top = Math.random() * window.innerHeight + 'px';
            sparkle.style.width = (2 + Math.random() * 4) + 'px';
            sparkle.style.height = (2 + Math.random() * 4) + 'px';
            document.body.appendChild(sparkle);

            setTimeout(() => sparkle.remove(), 2000);
        }

        function sayYes() {
            document.getElementById("message").innerText = 
                "Thank you for being my Valentine Love, I love you so much";

            // Floating hearts
            for (let i = 0; i < 25; i++) {
                setTimeout(createHeart, i * 120);
            }

            // Sparkles in the background
            for (let i = 0; i < 50; i++) {
                setTimeout(createSparkle, i * 100);
            }
        }

        function sayNo() {
            document.getElementById("message").innerText = 
                "Oh no! Maybe next time 😢";
        }
    </script>
</body>
</html>
