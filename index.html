<!DOCTYPE html>
<html>
<head>
    <title>Valentine Surprise</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #ff4d6d; /* Red Valentine background */
            position: relative;
        }
        h1 {
            color: #fff;
            margin-top: 20px;
            text-shadow: 2px 2px #ff1493;
        }
        img {
            width: 350px; /* Bigger image */
            height: auto;
            border-radius: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 25px rgba(255, 20, 147, 0.5);
            position: relative;
            z-index: 10;
        }
        button {
            padding: 12px 30px;
            font-size: 20px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background-color: #ff1493;
            color: white;
            transition: transform 0.2s;
            position: absolute;
            z-index: 10;
        }
        button:hover {
            transform: scale(1.1);
        }
        #yesBtn {
            top: 500px;
            left: 120px;
        }
        #noBtn {
            top: 500px;
            left: 300px;
        }
        .heart {
            position: absolute;
            font-size: 30px;
            animation: bounce 0.5s ease;
            user-select: none;
        }
        @keyframes bounce {
            0%,100%{transform:translateY(0);}
            50%{transform:translateY(-15px);}
        }
        .sparkle {
            position: absolute;
            width: 5px;
            height: 5px;
            color: #fff;
            animation: sparkle 2s infinite;
            font-size: 24px;
        }
        @keyframes sparkle {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            50% { transform: translateY(-20px) scale(1.5); opacity: 0.3; }
            100% { transform: translateY(0) scale(1); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <h1>Will you be my Valentine? ❤️💖</h1>

    <!-- Her Image -->
    <img src="her.jpeg" alt="Her Image" id="valImage">

    <!-- Buttons -->
    <button id="yesBtn">Yes ❤️</button>
    <button id="noBtn">No 💔</button>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const valImage = document.getElementById('valImage');

        let autoTimeoutFired = false;

        // Hearts flying
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerText = '💖';
            heart.style.left = (valImage.offsetLeft + valImage.offsetWidth/2 + (Math.random()*80-40)) + 'px';
            heart.style.top = (valImage.offsetTop - 20) + 'px';
            document.body.appendChild(heart);

            let step = 0;
            const moveHeart = setInterval(() => {
                heart.style.top = parseInt(heart.style.top) - 4 + 'px';
                heart.style.left = parseInt(heart.style.left) + Math.sin(step)*2 + 'px';
                step += 0.2;
                if(step > 80){
                    heart.remove();
                    clearInterval(moveHeart);
                }
            }, 20);
        }

        function createSparkle() {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.innerText = '❤️';
            sparkle.style.left = Math.random()*window.innerWidth + 'px';
            sparkle.style.top = Math.random()*window.innerHeight + 'px';
            document.body.appendChild(sparkle);
            setTimeout(()=>sparkle.remove(), 2000);
        }

        // Open new page with message
        function openMessage(msg){
            const newWindow = window.open('', '_blank');
            newWindow.document.write(`
                <html>
                <head>
                    <title>Valentine Message</title>
                    <style>
                        body { 
                            background: #ff4d6d; 
                            color: white; 
                            font-family: Arial, sans-serif;
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            height: 100vh;
                            text-align: center;
                            font-size: 28px;
                        }
                    </style>
                </head>
                <body>
                    ${msg} ❤️💖
                </body>
                </html>
            `);
            newWindow.document.close();
        }

        // Yes button
        yesBtn.addEventListener('click', () => {
            for(let i=0;i<25;i++) setTimeout(createHeart,i*100);
            for(let i=0;i<50;i++) setTimeout(createSparkle,i*80);
            openMessage("Thank you so much for being my Valentine, I Love you so much");
        });

        // No button
        function moveNoButton(){
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }
        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', moveNoButton);

        noBtn.addEventListener('click', () => {
            openMessage("Not even an option... Thank you for being my Valentine 🙈😘");
        });

        // Auto message after 15 sec
        setTimeout(()=>{
            if(!autoTimeoutFired){
                autoTimeoutFired = true;
                for(let i=0;i<25;i++) setTimeout(createHeart,i*100);
                for(let i=0;i<50;i++) setTimeout(createSparkle,i*80);
                openMessage("Thank you so much for being my Valentine, I Love you so much");
            }
        }, 15000);
    </script>
</body>
</html>
